# v3.8 Vanilla OTUS / SWAE configuration (J/psi -> mu+mu-), raw-coordinate latent SWD.
#
# Scientific definition (v3.8):
#   L = beta * L_reco + lambda * L_SW
#     L_reco = mean((x - D(E(x)))^2)          raw-coordinate per-event MSE
#     L_SW   = SWD_{p=2}(z, E(x))             raw-coordinate latent sliced Wasserstein
#
# This is a J/psi/CMS experiment using the original OTUS paper's core
# two-term SWAE objective. It is NOT a complete reproduction of the paper's
# Z -> e+e- schedule: it keeps the current J/psi stochastic 4x512 network,
# physical muon daughter masses, the selected CMS DoubleMuParked data, and a
# single 300-epoch stage with no anchors/cycles/physics terms.
#
# Exact differences from v3.7:
#   - the latent SWD operates on RAW physical 8D coordinates
#     (standardize_raw_matching: false); v3.7 used standardized latent
#     coordinates by default.
#   - all selected CMS and MG5 events are used under an 80/10/10 split; the
#     v3.7 Phase-A train/val/test caps are removed.
#   - training epochs traverse each domain shuffled without replacement;
#     unequal domains follow a documented deterministic cycle-and-reshuffle
#     policy with equal per-batch cardinalities.
#   - validation/test iteration is deterministic (no random resampling with
#     replacement).
#   - the reconstruction-selected checkpoint is named best_reconstruction.pt
#     (v3.7's best_cycle.pt filename is retained only for v3.7 runs).

paths:
  repo_root: .
  data_root: data
  cms_root_file: Run2012BC_DoubleMuParked_Muons.root
  theory_prior_file: cms_jpsi_mumu_mg5_8tev_1M.hdf5
  output_root: outputs/cms_JpsiDoubleMuons

run_name: Jpsi_v3.8_vanilla_paper_all_data_seed0

data:
  channel: muon
  root_step_size: 100 MB

device: auto
seed: 0
float_type: float32

data_split:
  train_ratio: 0.8
  val_ratio: 0.1
  # No train_max/val_max/test_max: v3.8 uses every selected event. The v3.7
  # Phase-A caps (500000/100000/100000) are deliberately absent.

# This reduced ROOT file exposes only nMuon, Muon_pt, Muon_eta, Muon_phi,
# Muon_mass, and Muon_charge. Do not add isolation/ID/IP cuts unless the file
# is regenerated with those branches.
muon_selection:
  muon_pt_min: 2.0
  muon_abs_eta_max: 2.4
  jpsi_mass_min: 2.6
  jpsi_mass_max: 3.5

# Same CondNoiseAutoencoder architecture as v3.7 and the v5_mps runs. This
# experiment isolates the loss and data-use changes, not the architecture.
model:
  class: CondNoiseAutoencoder
  num_hidden_layers: 4
  dim_per_hidden_layer: 512
  activation: ReLU
  sigma_fun: softplus
  sigma_floor: 0.001
  stoch_enc: true
  stoch_dec: true
  # The model may standardize its internal NN inputs/outputs; this is
  # separate from loss-level SWD standardization (disabled below).
  raw_io: true
  daughter_masses: [0.105658, 0.105658]

loss:
  kind: cms_jpsi_doublemuon_loss
  # Generalized vanilla two-term SWAE mode. vanilla_v3_7 remains a valid
  # historical alias and is false here so v3.8 semantics are explicit.
  vanilla_swae: true
  vanilla_v3_7: false
  # v3.8 core requirement: raw-coordinate latent SWD (no standardization
  # inside the sliced-Wasserstein comparison).
  standardize_raw_matching: false
  p: 2
  num_slices: 1000
  # Every supplemental component is disabled explicitly (defense in depth;
  # the vanilla mode already ignores these weights).
  raw_swd: 0.0
  marginal_w1: 0.0
  mass_w1: 0.0
  resonance_mass_w1: 0.0
  physics_swd: 0.0
  mass_kin_swd: 0.0
  transverse_w1: 0.0
  longitudinal_w1: 0.0
  tail_w1: 0.0
  pair_mass_w1: 0.0
  pair_pt_w1: 0.0
  lepton_pt_w1: 0.0
  delta_phi_w1: 0.0
  delta_eta_w1: 0.0
  pair_rapidity_w1: 0.0
  physics_coord_swd: 0.0
  mmd: 0.0
  x_reco_physics_w1: 0.0
  space_weights:
    z:
      raw_swd: 0.0
      marginal_w1: 0.0
      mass_w1: 0.0
      resonance_mass_w1: 0.0
      physics_swd: 0.0
      mass_kin_swd: 0.0
      transverse_w1: 0.0
      longitudinal_w1: 0.0
      tail_w1: 0.0
      pair_mass_w1: 0.0
      pair_pt_w1: 0.0
      lepton_pt_w1: 0.0
      delta_phi_w1: 0.0
      delta_eta_w1: 0.0
      pair_rapidity_w1: 0.0
      physics_coord_swd: 0.0
      mmd: 0.0
    x:
      raw_swd: 0.0
      marginal_w1: 0.0
      mass_w1: 0.0
      resonance_mass_w1: 0.0
      physics_swd: 0.0
      mass_kin_swd: 0.0
      transverse_w1: 0.0
      longitudinal_w1: 0.0
      tail_w1: 0.0
      pair_mass_w1: 0.0
      pair_pt_w1: 0.0
      lepton_pt_w1: 0.0
      delta_phi_w1: 0.0
      delta_eta_w1: 0.0
      pair_rapidity_w1: 0.0
      physics_coord_swd: 0.0
      mmd: 0.0
  # Checkpoint-selection score = beta * L_reco,val + lambda * L_SW,val. With
  # beta = lambda = 1.0 these weights implement exactly that objective; the
  # direct z -> x generator path is an offline diagnostic and never trains.
  selection_score:
    x_sim: 0.0
    z_prior: 1.0
    x_reco: 1.0
    cycle: 0.0
  decoder_num_noise_samples: 1

loaders:
  train_batch_size: 20000
  eval_batch_size: 20000
  preload_data_to_accelerator: false
  # v3.8 epoch semantics: shuffled traversal without replacement; the larger
  # domain is visited exactly once per epoch and the smaller domain cycles
  # (deterministically reshuffled) so every event is visited at least once.
  train_sampler: shuffled_without_replacement
  # Deterministic validation/test traversal (no random resampling with
  # replacement); both complete splits are covered.
  eval_sampler: deterministic_sequential

evaluation:
  min_truth_count: 20
  mass_range: [2.6, 3.5]
  mass_bin_width: 0.01
  mass_label: "m(mumu) [GeV]"
  channel_title: "CMS DoubleMuParked: J/psi -> mumu"
  reference_mass: 3.0969
  reference_label: "m_J/psi"
  diagnostic_freq: 10
  # Diagnostics snapshot and restore the global RNG so the fixed diagnostic
  # draws cannot perturb the training RNG stream.
  independent_diagnostic_rng: true
  # Fixed subset and projection seed used by the fixed-sample evaluation so
  # checkpoints share identical evaluation draws and SW projections.
  sw_batch_size: 20000
  sw_eval_seed: 12345

stages:
  # One continuous objective for all 300 epochs. No stage progression, no
  # decoder-only Stage 3, no anchors, no cycle terms, no physics terms.
  - name: stage1_vanilla_otus_swae
    mode: standard
    enabled: true
    epochs: 300
    lr: 0.001
    beta: 1.0
    lamb: 1.0
    tau: 0.0
    rho: 0.0
    nu_e: 0.0
    nu_d: 0.0
    num_slices: 1000
    log_freq: 10
    lr_decay: false
    freeze_encoder: false
    freeze_decoder: false
    early_stopping:
      enabled: false
      patience: 100
