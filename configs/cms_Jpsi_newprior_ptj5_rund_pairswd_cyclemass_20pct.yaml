# J/psi -> mu+mu- next-round training with the ptj=5 prior and the
# simplified three-term objective, Run D extension:
#
#   L_train = alpha(t) * [ SWD(z, E(x)) + SWD(x, D(z)) ]
#           + lambda_cycle * [ MSE(x, D(E(x)))
#                              + gamma * Huber((m_reco-m_true)/m_true) ]
#
# with pair_swd_weight adding a scale-aware pair-level SWD over
# [log(m), log(pT), y, cos(dphi), sin(dphi)] to both distribution paths.
# alpha(t) follows a cosine schedule inside the core stage and is shared by
# the latent matching and direct generator matching terms. lambda_cycle is
# kept fixed at 1.0.
#
# Checkpoint selection does NOT use the time-dependent L_train. Validation
# always computes the fixed reference with loss.selection_score weights.
#
# with loss.selection_score weights 1:1:1, and every raw/weighted component
# is logged separately (train_reference_loss / eval_reference_loss /
# train_x_loss / train_z_loss / train_alt_x_loss). This makes runs with
# different alpha schedules comparable at the same epoch and across runs.
#
# Data/prior: the ptj=5 rebuilt prior covers the CMS pair-pT support down to
# ~5.5 GeV (data minimum ~5.13 GeV). Same 20% data scope, architecture,
# batch size, and seeds as Jpsi_newprior_paper_20pct.

paths:
  repo_root: .
  data_root: data
  cms_root_file: Run2012BC_DoubleMuParked_Muons.root
  theory_prior_file: cms_jpsi_mumu_mg5_8tev_mixed_ptj5.hdf5
  output_root: outputs/cms_Jpsi_new

run_name: Jpsi_newprior_ptj5_rund_pairswd_cyclemass_20pct

data:
  channel: muon
  root_step_size: 100 MB

device: auto
seed: 0
float_type: float32

data_split:
  train_ratio: 0.8
  val_ratio: 0.1
  train_max: 580000
  val_max: 72500
  test_max: 72500

muon_selection:
  muon_pt_min: 3.0
  muon_pt_max: 100.0
  muon_abs_eta_max: 2.4
  jpsi_mass_min: 3.0369
  jpsi_mass_max: 3.1569

model:
  class: CondNoiseAutoencoder
  num_hidden_layers: 4
  dim_per_hidden_layer: 512
  activation: ReLU
  sigma_fun: softplus
  sigma_floor: 0.001
  stoch_enc: true
  stoch_dec: true
  raw_io: true
  daughter_masses: [0.105658, 0.105658]

loss:
  kind: cms_jpsi_doublemuon_loss
  vanilla_swae: true
  vanilla_v3_7: false
  standardize_raw_matching: false
  p: 2
  num_slices: 1000
  pair_swd_weight: 0.5
  pair_log_m_std_floor: 0.01
  pair_log_pt_std_floor: 0.05
  pair_y_std_floor: 0.20
  cycle_mass_huber_weight: 50.0
  cycle_mass_huber_delta: 0.02
  selection_score:
    x_sim: 1.0
    z_prior: 1.0
    x_reco: 1.0
    cycle: 0.0
  decoder_num_noise_samples: 1

loaders:
  train_batch_size: 20000
  eval_batch_size: 20000
  preload_data_to_accelerator: false
  train_sampler: shuffled_without_replacement
  eval_sampler: deterministic_sequential

evaluation:
  min_truth_count: 20
  mass_range: [3.0369, 3.1569]
  mass_bin_width: 0.01
  mass_label: "m(mumu) [GeV]"
  channel_title: "CMS DoubleMuParked: J/psi -> mumu"
  reference_mass: 3.0969
  reference_label: "m_J/psi"
  diagnostic_freq: 10
  independent_diagnostic_rng: true
  sw_batch_size: 20000
  sw_eval_seed: 12345

stages:
  - name: three_term_anchor_warmup
    mode: standard
    enabled: true
    epochs: 80
    lr: 0.001
    alpha: 1.0
    lambda_cycle: 1.0
    rho: 0.0
    nu_e: 50.0
    nu_d: 50.0
    num_slices: 1000
    log_freq: 10
    lr_decay: false
    freeze_encoder: false
    freeze_decoder: false
    early_stopping:
      enabled: false
      patience: 100
  - name: three_term_cosine_decay
    mode: standard
    enabled: true
    epochs: 220
    lr: 0.001
    alpha:
      start: 1.0
      end: 0.25
      schedule: cosine
    lambda_cycle: 1.0
    rho: 0.0
    nu_e: 0.0
    nu_d: 0.0
    num_slices: 1000
    log_freq: 10
    lr_decay: false
    freeze_encoder: false
    freeze_decoder: false
    early_stopping:
      enabled: false
      patience: 100
