# cms_Joint Run E noise control: lower m_tail, keep m_core unchanged.
#
# Comparison arm against Run E. Warm-starts from Run E stage-2 best and retrains
# only stages 3-4 with lower tail noise, so the trained core response is kept
# identical to Run E.
#
# Core noise is inherited unchanged.
# Stage 3 tail ramp is capped at 0.125 instead of 0.25.
# Stage 4 tail ramp is 0.125 -> 0.5 instead of 0.25 -> 1.
extends: cms_Joint_runE.yaml

run_label: Run E noise control low m_tail
run_name: Run_E_noiseLowTail

comparison:
  baseline_run: Run_E
  controlled_change: >-
    Warm start from Run E stage-2 best. Lower m_tail only:
    stage3 tail end 0.25 -> 0.125;
    stage4 tail 0.25 -> 1 becomes 0.125 -> 0.5;
    m_core response preserved from Run E stage-2 best.

paths:
  # Put run outputs under Run_E/ while still reusing the shared top-level data cache.
  output_root: outputs/cms_Joint/Run_E
  cache_root: outputs/cms_Joint

stages:
  # Tail-only arm: start from Run E's stage-2 best so the trained core
  # response is identical to Run E; only stages 3-4 are retrained with lower
  # tail noise.
  - name: runA_stage1_deterministic_identity
    enabled: false
  - name: runA_stage2_gaussian_response
    enabled: false
  - name: runA_stage3_stochastic_joint
    tail_noise_multiplier:
      start: 0
      end: 0.125
      schedule: linear
  - name: runA_stage4_tail_polish
    tail_noise_multiplier:
      start: 0.125
      end: 0.5
      schedule: cosine
