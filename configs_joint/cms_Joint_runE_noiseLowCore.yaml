# cms_Joint Run E noise control: lower m_core, keep m_tail unchanged.
#
# Comparison arm against Run E. Epoch numbers stay at the original
# 432-epoch schedule so the only controlled change is the core noise ceiling.
#
# Stage 1 remains deterministic.
# Stage 2 core ramp is capped at 0.5 instead of 1.0.
# Stages 3-4 keep core at 0.5 instead of 1.0.
# Tail noise schedule is inherited unchanged.
extends: cms_Joint_runE.yaml

run_label: Run E noise control low m_core
run_name: Run_E_noiseLowCore

comparison:
  baseline_run: Run_E
  controlled_change: >-
    Original 432 epochs. Lower m_core only:
    stage2 ramp 0.1 -> 0.5, stages3-4 core 0.5;
    m_tail schedule unchanged.

paths:
  # Put run outputs under Run_E/ while still reusing the shared top-level data cache.
  output_root: outputs/cms_Joint/Run_E
  cache_root: outputs/cms_Joint

stages:
  - name: runA_stage1_deterministic_identity
    enabled: false
  - name: runA_stage2_gaussian_response
    core_noise_multiplier:
      start: 0.1
      end: 0.5
      schedule: cosine
  - name: runA_stage3_stochastic_joint
    core_noise_multiplier: 0.5
  - name: runA_stage4_tail_polish
    core_noise_multiplier: 0.5
