# cms_Joint ppzee: a BENCH, not a result.
#
# What this is for
# ----------------
# memory.md section 7 step 3. Every metric the joint pipeline reports is a
# marginal, and the 2026-09-04 A/B proved a map that does nothing can satisfy
# marginals (section 7.2). ppzee is the upstream OTUS paper's own paired
# benchmark: it carries event-by-event (z, x) partners, so the encoder can be
# scored per event against each event's own withheld truth. Training stays
# unpaired exactly as it is for the CMS regions; the pairing is recorded in
# joint_split_manifest.json under regions.ppzee.pair_index and is read only by
# scripts_joint/paired_closure.py after training. See scripts_joint/paired_data.py.
#
# The number to beat is 3.33 -- the upstream encoder's residual_rms_vs_identity
# on this exact 160,000-event test file (memory.md section 7.4, reproduced
# 2026-09-07). 1.0 means "no better per event than handing back the
# detector-level event". Below 1.0 has never been done in this literature and
# must be treated as pairing leakage until disproved.
#
# This config is deliberately NOT `extends: cms_Joint_runE.yaml`. The config
# merge in cms_data._deep_merge has no key-deletion operator, so an inheriting
# config cannot drop the inherited jpsi and z regions. Every model, loss,
# loader, checkpoint_selection and final_evaluation value below is therefore a
# verbatim copy of the resolved Run E config
# (`load_config('configs_joint/cms_Joint_runE.yaml')`, dumped 2026-09-07), so
# the comparison is against our own architecture rather than a new one. The
# only intentional differences are listed here:
#
#   1. one region, ppzee, on the paired-benchmark channel;
#   2. electron daughter masses instead of muon;
#   3. a bounded two-stage schedule instead of Run E's 432 epochs -- this is a
#      bench and is meant to reach a stable validation, not a headline;
#   4. gates and targets rescaled to a 91 GeV resonance, with two omissions
#      documented at the gate block below.
#
# Two facts about this dataset that must be stated whenever its number is
# quoted (both artifact-measured 2026-09-07, outputs/ppzee_layout.json):
#
#   * The truth has IDENTICALLY ZERO pair pT -- rho(FDL px1, px2) = -1.0000
#     exactly, max pair pT = 0. The truth is LO 2 -> 1 with no recoil, so every
#     unit of the reco pair pT (median 8.82 GeV) was manufactured downstream.
#     This is the configuration docs/unified_prior_method.md section 4 argues
#     is wrong for a response study. It does not invalidate the per-event
#     closure measurement, but it changes what the number means.
#   * Both z and x are numerically massless: |m|/E per particle is 3.6e-06
#     (median) for FDL and 1.3e-08 for ROL, against m_e/E = 8.8e-06 at the
#     median energy of 58 GeV. The daughter-mass correction on the pair mass is
#     of order 3e-09 GeV, seven orders below the 2.65 GeV detector resolution,
#     so the muon case's +8.25 MeV convention question (memory.md section 5)
#     simply does not arise here. Electron masses are set anyway, for honesty.

series: cms_Joint
run_label: ppzee paired-closure bench
run_name: ppzee

comparison:
  baseline_run: Run_E
  controlled_change: >-
    Dataset and channel only. The model, losses, optimiser settings, sampler
    and checkpoint-selection machinery are Run E's, copied verbatim; the
    schedule is bounded to two stages because this is a development bench.

device: auto
cuda_memory_limit_gb: 11
float_type: float32
seed: 1701
require_stage_gate_pass: false

# The mass used to rebuild E from the cylindrical coordinates. The daughters
# here are electrons; see the header note on why the value is immaterial.
muon_mass_gev: 0.00051099895

paths:
  repo_root: .
  data_root: data
  output_root: outputs/cms_Joint

region_order: [ppzee]
region_weights:
  ppzee: 1

# There is no Upsilon and no CMS open data anywhere in this run.
holdout:
  status: not_applicable
  policy: >-
    This bench uses only the upstream ppzee benchmark files. No CMS open data,
    and no Upsilon sample, is opened by it.

# --- Run E model, verbatim, with electron daughter masses -------------------
model:
  class: joint_cylindrical_residual
  activation: SiLU
  condition_features:
    - log_pt_minus
    - eta_minus
    - sin_phi_minus
    - cos_phi_minus
    - log_pt_plus
    - eta_plus
    - sin_phi_plus
    - cos_phi_plus
    - log_pair_pt
    - pair_rapidity
    - cos_delta_phi
    - sin_delta_phi
    - delta_eta
  condition_stats_max_events_per_region: 70000
  core_log_sigma_bias: -4
  core_sigma_floors: [0.001, 0.001, 0.001, 0.001, 0.001, 0.001]
  core_sigma_scales: [0.08, 0.08, 0.06, 0.08, 0.08, 0.06]
  daughter_masses: [0.00051099895, 0.00051099895]
  flow_steps: 2
  hidden_dims: [512, 512, 512, 512, 512, 512]
  maximum_heavy_noise: 6
  mean_residual_limits: [0.35, 0.3, 0.25, 0.35, 0.3, 0.25]
  student_t_degrees_of_freedom: 4
  tail_log_sigma_bias: -5
  tail_sigma_scales: [0.12, 0.12, 0.1, 0.12, 0.12, 0.1]

# --- Run E loss, verbatim ---------------------------------------------------
loss:
  kind: cms_jpsi_doublemuon_loss
  decoder_num_noise_samples: 1
  delta_eta_w1: 0.25
  delta_phi_w1: 0.25
  lepton_pt_w1: 0.5
  longitudinal_w1: 0.2
  marginal_w1: 0.25
  mass_kin_swd: 0.5
  mass_w1: 0
  mmd: 0
  num_slices: 512
  p: 1
  pair_mass_w1: 1
  pair_pt_w1: 1
  pair_rapidity_w1: 0.25
  physics_coord_swd: 0.25
  physics_swd: 0.5
  raw_swd: 0.25
  resonance_mass_w1: 0
  selection_score:
    cycle: 0
    x_reco: 0.1
    x_sim: 1
    z_prior: 1
  standardize_raw_matching: true
  tail_w1: 0.1
  transverse_w1: 0.25
  vanilla_swae: false
  vanilla_v3_7: false
  x_reco_physics_w1: 1

# --- Run E loaders / selection / evaluation, verbatim -----------------------
loaders:
  epoch_definition: full_pass
  sampling: cycling_without_replacement
  steps_per_epoch: null
  train_batch_size: 24576
  eval_batch_size: 4096
  validation_draws: 2
  validation_events: 8192

checkpoint_selection:
  base_loss_weight: 0
  gate_fail_penalty: 1000000
  hard_gates: true
  mode: worst_region_rms
  region_reduction: rms

final_evaluation:
  batch_size: 4096
  bootstrap_replicates: 200
  c2st_folds: 5
  c2st_max_samples: 5000
  c2st_mlp_iterations: 250
  # The test split is all 160,000 rows of ppzee_test.hdf5 so the paired closure
  # is scored on exactly the events the upstream 3.33 was measured on. The
  # marginal evaluation is capped here only to bound its bootstrap cost.
  max_events: 50000
  seed: 20260821

# --- Bounded schedule -------------------------------------------------------
# Stages 1 and 2 are Run E's stage 1 and stage 2 with every optimiser, noise
# and loss setting unchanged and only the epoch count reduced. Run E selected
# at stage-1 epoch 65 and the A/B arms were already decided inside stage 1, so
# the informative window is early. Stages 3 and 4 are retired by name.
stages:
  - name: runA_stage1_deterministic_identity
    enabled: true
    epochs: 60
    eval_every: 5
    optimizer: adamw
    lr: 0.0002
    lr_schedule: cosine
    lr_min_factor: 0.1
    lr_warmup_epochs: 5
    lr_warmup_start_factor: 0.1
    weight_decay: 0.00001
    adam_eps: 1.0e-7
    gradient_clip_norm: 1
    num_slices: 256
    beta: 1
    lamb: 1
    tau: 0.25
    rho: 0
    nu_e: 1
    nu_d: 1
    core_noise_multiplier: 0
    tail_noise_multiplier: 0

  - name: runA_stage2_gaussian_response
    enabled: true
    epochs: 60
    eval_every: 5
    optimizer: adamw
    lr: 0.0001
    lr_schedule: cosine
    lr_min_factor: 0.1
    lr_warmup_epochs: 3
    lr_warmup_start_factor: 0.2
    weight_decay: 0.00001
    adam_eps: 1.0e-7
    gradient_clip_norm: 1
    num_slices: 384
    beta: 1
    lamb: 1
    tau: 1
    rho: 0
    nu_e: 0.1
    nu_d: 0.1
    core_noise_multiplier:
      start: 0.1
      end: 1
      schedule: cosine
    tail_noise_multiplier: 0

  - name: runA_stage3_stochastic_joint
    enabled: false
    epochs: 0
  - name: runA_stage4_tail_polish
    enabled: false
    epochs: 0

regions:
  ppzee:
    label: pp -> Z -> ee (upstream OTUS paired benchmark)
    seed: 1701
    data:
      channel: ppzee
      # Established numerically and from
      # dataGenerationCode/ppzeeDataGenCode/FinalData/FinalData_ppzee.py:
      # FDL [N, 8] is the MadGraph e- then e+, each (px, py, pz, E). ROL
      # [N, 12] is the Delphes e-, e+, then MET as a massless four-vector.
      # x is columns 0:8; the MET is dropped because z carries no MET partner
      # to score it against. utilityFunctions/configs.py says the same:
      # "x_dim = 12 includes MET, this is removed in experiments".
      z_dataset: FDL
      x_dataset: ROL
      z_columns: [0, 8]
      x_columns: [0, 8]
    paths:
      paired_train_file: ppzee.hdf5
      paired_test_file: ppzee_test.hdf5
    data_split:
      train_ratio: 0.8
      val_ratio: 0.1
      # 331,699 paired rows in the fit file; the caps keep this bench at about
      # the size of the joint programme's Z region. The test split is the
      # whole 160,000-row held-out file (test_max null), which is disjoint
      # from the fit file: artifact-measured 2026-09-07, zero shared rows by
      # blake2b hash over both FDL and FDL+ROL.
      train_max: 120000
      val_max: 15000
      test_max: null
    selection:
      # Rescaled from the joint programme's Z region, which is the same
      # resonance at the same mass. Two deliberate omissions:
      #
      #  * latent_pair_pt_ks is NOT gated or targeted. The truth pair pT is
      #    identically zero, so the x -> z pair-pT KS against the identity map
      #    is ~1 by construction and no map that keeps the leptons anywhere
      #    near their measured directions can move it. Gating it would make
      #    every checkpoint fail for a reason that has nothing to do with the
      #    question. direct_pair_pt_ks IS kept: manufacturing recoil from a
      #    2 -> 1 truth is the decoder's actual job here.
      #  * cycle gauges are absent by design; the identity cycle is x -> x and
      #    every ratio against it divides by zero (memory.md section 7.3).
      gates:
        latent_mass_ks: 0.15
        latent_mass_w1_gev: 3
        latent_mass_width_rel_error: 0.5
        latent_mass_ks_vs_identity: 0.5
        latent_mass_w1_gev_vs_identity: 0.5
        direct_mass_ks: 0.15
        direct_mass_w1_gev: 3
        direct_mass_width_rel_error: 0.5
        direct_pair_pt_ks: 0.25
        cycle_mass_ks: 0.15
        cycle_mass_w1_gev: 3
      targets:
        latent_mass_ks: 0.04
        latent_mass_w1_gev: 0.5
        latent_mass_width_rel_error: 0.1
        latent_mass_ks_vs_identity: 0.25
        latent_mass_w1_gev_vs_identity: 0.25
        direct_mass_ks: 0.03
        direct_mass_w1_gev: 0.5
        direct_mass_width_rel_error: 0.1
        direct_pair_pt_ks: 0.07
        cycle_mass_ks: 0.04
        cycle_mass_w1_gev: 0.5
